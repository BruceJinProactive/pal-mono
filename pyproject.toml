[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pal-mono"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
readme = "README.md"
authors = [{name = "Proactive AI Lab", email = "rnd@proactiveailab.com"}]
dependencies = [
  "agno==1.7.6", # AI agent framework for building intelligent applications
  "aioboto3==15.5.0", # Async AWS SDK for Python with asyncio support
  "alembic==1.13.2", # Database migration tool for SQLAlchemy
  "anthropic==0.71.0", # Official Anthropic API client for Claude models
  "asyncpg==0.30.0", # High-performance async PostgreSQL driver
  "beautifulsoup4==4.12.3", # HTML/XML parsing and web scraping library
  "boto3==1.40.61", # Amazon Web Services SDK for Python
  "cryptography==44.0.2", # Modern cryptographic recipes and primitives
  "datadog==0.52.0", # Datadog API client for metrics and monitoring
  "ddtrace==3.11.0", # Datadog APM and distributed tracing library
  "docusign-esign==3.26.0", # DocuSign eSignature API client for embedded signing workflows
  "email-validator==2.2.0", # Robust email address validation with DNS checking
  "fastapi==0.116.1", # Modern async web framework with automatic API docs
  "firecrawl-py>=1.5.0", # Web scraping and crawling with LLM extraction
  "geopy==2.4.1", # Geocoding library for location services and mapping
  "google-genai==1.25.0", # Google Gemini AI SDK for generative models
  "groq==0.15.0", # Groq API client for fast LLM inference
  "httpcore==1.0.9", # Low-level HTTP transport implementation
  "httpx==0.28.1", # Modern async/sync HTTP client with HTTP/2 support
  "instructor==1.9.2", # Structured outputs from LLMs using Pydantic models
  "jinja2==3.1.6", # Modern template engine for Python
  "lingua-language-detector==2.1.1", # Fast and accurate language detection library
  "llama-index-core==0.14.3", # Llma index core module
  "llama-index-embeddings-cohere==0.6.1", # Cohere embeddings integration for LlamaIndex
  "llama-index-llms-gemini==0.6.1", # Google Gemini LLM integration for LlamaIndex
  "llama-index-llms-groq==0.4.1", # Groq LLM integration for LlamaIndex
  "llama-index-vector-stores-pinecone==0.7.1", # Pinecone vector database integration for LlamaIndex
  "mem0ai==0.1.48", # Personalized AI memory layer for context retention
  "openai==1.95.1", # Official OpenAI API client for GPT models
  "pal-agents @ git+https://github.com/Proactive-AI-Lab/pal-agents.git@v0.2.8", # Pal-agents AI agent framework (production)
  "pgvector==0.3.2", # PostgreSQL extension for vector similarity search
  "pinecone==7.3.0", # Managed vector database for AI applications
  "polyline==2.0.2", # Google polyline encoding/decoding for GPS coordinates
  "psycopg[binary]==3.2.1", # Modern PostgreSQL adapter with binary wheels
  "pytest-cov==6.0.0", # Code coverage reporting for pytest
  "pytest-mock==3.14.0", # Mocking and patching utilities for pytest
  "pytest==8.3.2", # Python testing framework with fixtures and plugins
  "python-json-logger==2.0.7", # JSON formatter for Python's logging module
  "python-multipart==0.0.19", # HTTP multipart form data parser
  "requests==2.32.4", # Simple HTTP library for human beings
  "shapely==2.1.0", # Geometric operations and spatial analysis library
  "slack-bolt==1.20.1", # Slack Bolt framework for building Slack apps
  "slack-sdk==3.33.5", # Official Slack SDK for Python
  "sqlalchemy==2.0.32", # Python SQL toolkit and Object Relational Mapping
  "stripe>=12,<13", # Official Stripe API client for payment processing
  "twilio==9.3.2", # Twilio API client for SMS, voice, and messaging
  "urlextract==1.9.0", # URL extraction from text using regular expressions
  "uvicorn==0.30.6", # Lightning-fast ASGI server for async Python web apps
  "vapi-server-sdk==1.6.0" # Voice AI platform SDK for conversational interfaces
]

[project.optional-dependencies]
dev = [
  "black~=24.8.0",
  "import-linter~=2.2",
  "isort~=5.13.2",
  "pyright~=1.1.382",
  "ruff~=0.6.2",
  "toml-sort~=0.24.2"
]

[tool.black]
line-length = 88
extend-exclude = "(?x)(^|/)build/"

[tool.importlinter]
root_packages = ["agent", "api", "db", "services", "tools", "utils"]

[[tool.importlinter.contracts]]
name = "Layered architecture: api -> services -> db"
type = "layers"
layers = ["api", "services", "db"] # isort: skip

[[tool.importlinter.contracts]]
name = "Utils must be isolated - no internal dependencies"
type = "forbidden"
source_modules = ["utils"]
forbidden_modules = ["agent", "api", "db", "services", "tools"]

[tool.isort]
profile = "black"
line_length = 88
skip_glob = ["build/**"]

[tool.pyright]
exclude = ["**/__pycache__", ".git", ".venv*", "aienv*", "build", "db/migrations/versions/", "workspace/"]
typeCheckingMode = "standard"

[tool.ruff]
extend-include = ["*.ipynb"]
exclude = [".git", ".venv*", "aienv*", "build"]

[tool.ruff.lint.per-file-ignores]
# Ignore `F401` (import violations) in all `__init__.py` files
"__init__.py" = ["F401", "F403"]
"*.ipynb" = ["E402"]

[tool.setuptools.packages.find]

[tool.tomlsort]
# Disable inline array sorting for importlinter contracts to preserve layer order
overrides."*.layers".inline_arrays = false

[tool.uv]
override-dependencies = [
  "griffe>=1.5.6" # Override agenticmem's pinned griffe to resolve conflict with openai-agents
]

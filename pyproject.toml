[project]
name = "pal-mono"
version = "0.1.0"
requires-python = ">3.7"
readme = "README.md"
authors = [{ name = "Team", email = "team@team.com" }]

dependencies = [
  # Api server libraries
  "fastapi==0.111.0",
  "typer==0.12.3",
  "uvicorn==0.29.0",

  # Database libraries
  "alembic==1.13.1",
  "pgvector==0.2.5",
  "psycopg[binary]==3.1.19",
  "sqlalchemy==2.0.30",

  # Project libraries
  "openai==1.30.1",
  "pypdf==4.2.0",
  "streamlit==1.34.0",
  "tiktoken==0.7.0",
  "beautifulsoup4==4.12.3",
  "types-beautifulsoup4==4.12.0.20240511",
  "pillow==10.3.0",
  "types-Pillow==10.2.0.20240511",
  "streamlit-cognito-auth==1.3.1",
  "streamlit-extras==0.4.2",
  "st-pages==0.4.5",

  # Validation
  "black==24.4.2",
  "isort==5.13.2",
  "ruff==0.4.4",
  "mypy==1.10.0",

  # phidata
  "phidata==2.4.18",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]

# Change this value to use a different directory for the phidata workspace.
# [tool.phidata]
# workspace = "workspace"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
extend-include = ["*.ipynb"]
exclude = ["aienv*", ".venv*"]
[tool.ruff.lint.per-file-ignores]
# Ignore `F401` (import violations) in all `__init__.py` files
"__init__.py" = ["F401"]
"*.ipynb" = ["E402"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = ["aienv*", ".venv*"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "setuptools.*"]
ignore_missing_imports = true
[project.optional-dependencies]
dev = [
  "black~=24.8.0",
  "import-linter~=2.2",
  "isort~=5.13.2",
  "pyright~=1.1.382",
  "ruff~=0.6.2",
  "toml-sort~=0.24.2"
]

[tool.black]
line-length = 88
extend-exclude = "(?x)(^|/)(build|\\.agents|\\.claude|\\.pal-skills)/"

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 20 # TARGET: 40 -- raise after Phase 0 integration fixtures land

[tool.coverage.run]
source = ["agent", "api", "db", "events", "services", "tools", "utils"]
omit = ["*/conftest.py", "*/migrations/*", "*/tests/*"]

[tool.importlinter]
root_packages = ["agent", "api", "db", "services", "tools", "utils"]

[[tool.importlinter.contracts]]
name = "Layered architecture: api -> services -> db"
type = "layers"
layers = ["api", "services", "db"] # isort: skip

[[tool.importlinter.contracts]]
name = "Utils must be isolated - no internal dependencies"
type = "forbidden"
source_modules = ["utils"]
forbidden_modules = ["agent", "api", "db", "services", "tools"]

[tool.isort]
profile = "black"
line_length = 88
skip_glob = [".agents/**", ".claude/**", ".pal-skills/**", "build/**"]

[tool.pyright]
exclude = [
  "**/__pycache__",
  ".agents",
  ".claude",
  ".devenv",
  ".git",
  ".pal-skills",
  ".venv*",
  "aienv*",
  "build",
  "db/migrations/versions/",
  "workspace/"
]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers"
markers = [
  "integration: Tests requiring a real PostgreSQL database",
  "slow: Long-running tests (concurrency, full CRUD matrix) for nightly runs only",
  "smoke: Fast tests (<30s total) for pre-commit and quick CI feedback"
]

[tool.ruff]
extend-include = ["*.ipynb"]
exclude = [".agents", ".claude", ".git", ".pal-skills", ".venv*", "aienv*", "build"]

[tool.ruff.lint.per-file-ignores]
# Ignore `F401` (import violations) in all `__init__.py` files
"__init__.py" = ["F401", "F403"]
"*.ipynb" = ["E402"]

[tool.setuptools.packages.find]

[tool.tomlsort]
# Disable inline array sorting for importlinter contracts to preserve layer order
overrides."*.layers".inline_arrays = false

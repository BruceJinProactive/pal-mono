[project]
name = "pal-mono"
version = "0.1.0"
requires-python = ">3.7"
readme = "README.md"
authors = [{ name = "Team", email = "team@team.com" }]

dependencies = [
  # /api
  "fastapi==0.112.2",
  "uvicorn==0.30.6",
  "python-multipart==0.0.19",

  # /app
  "openpyxl==3.1.5",
  "streamlit==1.37.1",
  "streamlit-cognito-auth==1.3.1",
  "streamlit-extras==0.4.2",

  # /db
  "alembic==1.13.2",
  "pgvector==0.3.2",
  "psycopg[binary]==3.2.1",
  "sqlalchemy==2.0.32",
  "asyncpg==0.30.0",

  # /ai
  "openai==1.59.9",
  "phidata==2.7.8",
  "pypdf==5.1.0",
  "geopy==2.4.1",
  "google-cloud-aiplatform==1.70.0",
  "google-auth==2.35.0",
  "pinecone==5.3.1",
  "ShopifyAPI==12.6.0",
  "ddtrace==2.18.1",
  "llama-index==0.12.12",
  "llama-index-vector-stores-pinecone==0.4.4",
  
  # DevOps
  "python-json-logger==2.0.7",
  "pytest==8.3.2",
  "pytest-mock==3.14.0",
  "pytest-cov==6.0.0",
]

[project.optional-dependencies]
dev = [
    "black==24.8.0",
    "isort==5.13.2",
    "ruff==0.6.2",
    "pyright==1.1.382",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]

# Change this value to use a different directory for the phidata workspace.
# [tool.phidata]
# workspace = "workspace"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
extend-include = ["*.ipynb"]
exclude = ["aienv*", ".venv*"]
[tool.ruff.lint.per-file-ignores]
# Ignore `F401` (import violations) in all `__init__.py` files
"__init__.py" = ["F401", "F403"]
"*.ipynb" = ["E402"]

[tool.pyright]
exclude = ["aienv*", ".venv*", "**/__pycache__", "workspace/"]
typeCheckingMode = "standard"
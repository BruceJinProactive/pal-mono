[project]
name = "pal-mono"
version = "0.1.0"
requires-python = ">3.7"
readme = "README.md"
authors = [{ name = "Team", email = "team@team.com" }]

dependencies = [
  # /api
  "fastapi==0.112.2",
  "uvicorn==0.30.6",

  # /app
  "streamlit==1.34.0",
  "streamlit-cognito-auth==1.3.1",
  "streamlit-extras==0.4.2",
  "st-pages==0.4.5",

  # /db
  "alembic==1.13.2",
  "pgvector==0.3.2",
  "psycopg[binary]==3.2.1",
  "sqlalchemy==2.0.32",

  # /ai
  "openai==1.42.0",
  "phidata==2.4.29",

  # Validation
  "black==24.8.0",
  "isort==5.13.2",
  "ruff==0.6.2",
  "mypy==1.11.2",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]

# Change this value to use a different directory for the phidata workspace.
# [tool.phidata]
# workspace = "workspace"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
extend-include = ["*.ipynb"]
exclude = ["aienv*", ".venv*"]
[tool.ruff.lint.per-file-ignores]
# Ignore `F401` (import violations) in all `__init__.py` files
"__init__.py" = ["F401"]
"*.ipynb" = ["E402"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = ["aienv*", ".venv*"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "setuptools.*"]
ignore_missing_imports = true
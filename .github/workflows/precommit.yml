name: Pre commit

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - "main"
  push:
    branches:
      - "main"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Create a virtual environment and activate it
      - name: Set up virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies in virtual environment
        run: |
          venv/bin/python -m pip install --upgrade pip setuptools wheel
          venv/bin/pip install black==24.8.0 isort==5.13.2 ruff==0.6.2 pyright==1.1.382
          venv/bin/pip install --no-deps -r requirements.txt

      - name: Format check with black
        run: |
          venv/bin/black . --check --diff

      - name: Lint with ruff
        run: |
          venv/bin/ruff check .

      - name: Sort imports with isort
        run: |
          venv/bin/isort .

      # - name: Type-check with mypy
      #   run: |
      #     venv/bin/mypy .

      # If the job fails, send a message to Slack
      - name: Notify Slack
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
          channel: '#workflows'
        if: failure() && github.ref == 'refs/heads/main' && github.event.pull_request.draft == false
        env:
          SLACK_WEBHOOK_URL_BUILD: ${{ secrets.SLACK_WEBHOOK_URL_BUILD }}

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Create a virtual environment and activate it
      - name: Set up virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies in virtual environment
        run: |
          venv/bin/python -m pip install --upgrade pip setuptools wheel
          venv/bin/pip install black==24.8.0 isort==5.13.2 ruff==0.6.2 pyright==1.1.382
          venv/bin/pip install -r requirements.txt

      - name: Run pytest
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_USER_POOL_ID: ${{ secrets.AWS_USER_POOL_ID }}
          AWS_APP_CLIENT_ID: ${{ secrets.AWS_APP_CLIENT_ID }}
          AWS_APP_CLIENT_SECRET: ${{ secrets.AWS_APP_CLIENT_SECRET }}
          AWS_ADMIN_CONSOLE_USER_POOL_ID: ${{ secrets.AWS_ADMIN_CONSOLE_USER_POOL_ID }}
          AWS_CLIENT_SECRET_NAME: ${{ secrets.AWS_CLIENT_SECRET_NAME }}
          AWS_ADMIN_CONSOLE_APP_CLIENT_ID: ${{ secrets.AWS_ADMIN_CONSOLE_APP_CLIENT_ID }}
          ADMIN_CONSOLE_AWS_CLIENT_ID: ${{ secrets.ADMIN_CONSOLE_AWS_CLIENT_ID }}
          MODAL_API_KEY: ${{ secrets.MODAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ci: true
        run: |
          venv/bin/pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          tags: myapp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run myapp:${{ github.sha }} echo "Container is running correctly"

      # If the build job fails, send a message to Slack
      - name: Notify Slack
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
          channel: '#workflows'
        if: failure() && github.ref == 'refs/heads/main' && github.event.pull_request.draft == false
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_BUILD }}
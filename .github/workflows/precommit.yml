name: Pre commit

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - "main"
  push:
    branches:
      - "main"

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Configure Git for private repos
        run: |
          git config --global url."https://${{ secrets.PAL_GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies with uv
        run: uv sync --all-extras

      - name: Clean up Git config
        if: always()
        run: |
          git config --global --unset-all url."https://${{ secrets.PAL_GITHUB_TOKEN }}@github.com/".insteadOf || true

      - name: Add .venv/bin to PATH
        run: |
          echo "${PWD}/.venv/bin" >> $GITHUB_PATH

      - name: Run validation script
        run: scripts/validate.sh --check

      # If the job fails, send a message to Slack
      - name: Notify Slack
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
          channel: '#workflows'
        if: failure() && github.ref == 'refs/heads/main' && github.event.pull_request.draft == false
        env:
          SLACK_WEBHOOK_URL_BUILD: ${{ secrets.SLACK_WEBHOOK_URL_BUILD }}

  pre-coverage:
    # TODO: Re-enable tests for automated dependency updates
    # Current status: Tests disabled - blocking automation
    # Required actions:
    #   1. Fix existing test failures (run: pytest --cov=. locally)
    #   2. Add test_imports.py for dependency smoke tests (30 min)
    #   3. Add API endpoint tests for critical paths (4-8 hours)
    #   4. Achieve 40-50% coverage on core services
    # Once complete: Change if: ${{ false }} to if: ${{ true }}
    # Then: Enable Renovate/Dependabot for automated dependency PRs
    if: ${{ false }}  # This will prevent the job from running
    runs-on: ubuntu-latest

    outputs:
      main_coverage: ${{ steps.get_main_coverage.outputs.coverage }}

    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false  # Disable cache since main branch may not have uv.lock yet

      - name: Configure Git for private repos
        run: |
          git config --global url."https://${{ secrets.PAL_GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies with uv
        run: uv sync --all-extras

      - name: Clean up Git config
        if: always()
        run: |
          git config --global --unset-all url."https://${{ secrets.PAL_GITHUB_TOKEN }}@github.com/".insteadOf || true

      - name: Run main pytest report
        id: get_main_coverage
        run: |
          echo "coverage<<EOF" >> $GITHUB_OUTPUT
          echo "$(.venv/bin/pytest --cov=. | awk '{printf "%s\\n", $0}')" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  test:
    # TODO: Re-enable tests (see pre-coverage job for details)
    if: ${{ false }}  # This will prevent the job from running
    runs-on: ubuntu-latest

    needs: pre-coverage

    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Configure Git for private repos
        run: |
          git config --global url."https://${{ secrets.PAL_GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies with uv
        run: uv sync --all-extras

      - name: Clean up Git config
        if: always()
        run: |
          git config --global --unset-all url."https://${{ secrets.PAL_GITHUB_TOKEN }}@github.com/".insteadOf || true

      - name: Run new pytest report
        id: get_new_coverage
        run: |
          echo "coverage<<EOF" >> $GITHUB_OUTPUT
          echo "$(.venv/bin/pytest --cov=. | awk '{printf "%s\\n", $0}')" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45

      - name: Get coverage warnings
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        id: get_coverage_warnings
        run: |
          echo "warnings<<EOF" >> $GITHUB_OUTPUT
          echo "$(.venv/bin/python ./.github/workflows/coverage_analysis.py '${{ needs.pre-coverage.outputs.main_coverage }}' '${{ steps.get_new_coverage.outputs.coverage }}' ${ALL_CHANGED_FILES[@]} | awk '{printf "%s\\n", $0}')" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: PR testing coverage comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "${{ steps.get_coverage_warnings.outputs.warnings }}<details><summary>Code coverage</summary>\n\n```\n${{ steps.get_new_coverage.outputs.coverage }}```\n\n</details>"
            })

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          tags: myapp:${{ github.sha }}
          secrets: |
            github_token=${{ secrets.PAL_GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run myapp:${{ github.sha }} echo "Container is running correctly"

      # If the build job fails, send a message to Slack
      - name: Notify Slack
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
          channel: '#workflows'
        if: failure() && github.ref == 'refs/heads/main' && github.event.pull_request.draft == false
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_BUILD }}

name: Pre commit

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - "main"
  push:
    branches:
      - "main"

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Create a virtual environment and activate it
      - name: Set up virtual environment
        run: |
          python -m venv .venv
          source .venv/bin/activate

      - name: Install dependencies in virtual environment
        run: |
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
          .venv/bin/pip install black==24.8.0 isort==5.13.2 ruff==0.6.2 pyright==1.1.382
          .venv/bin/pip install -r requirements.txt

      - name: Format check with black
        run: |
          .venv/bin/black . --check --diff

      - name: Lint with ruff
        run: |
          .venv/bin/ruff check .

      - name: Sort imports with isort
        run: |
          .venv/bin/isort .

      - name: Set PATHS for pyright
        run: |
          echo "${PWD}/.venv/bin" >> $GITHUB_PATH

      - name: Type-check with pyright
        run: |
          .venv/bin/pyright .

      # If the job fails, send a message to Slack
      - name: Notify Slack
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
          channel: '#workflows'
        if: failure() && github.ref == 'refs/heads/main' && github.event.pull_request.draft == false
        env:
          SLACK_WEBHOOK_URL_BUILD: ${{ secrets.SLACK_WEBHOOK_URL_BUILD }}

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Create a virtual environment and activate it
      - name: Set up virtual environment
        run: |
          python -m venv .venv
          source .venv/bin/activate

      - name: Install dependencies in virtual environment
        run: |
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
          .venv/bin/pip install black==24.8.0 isort==5.13.2 ruff==0.6.2 pyright==1.1.382
          .venv/bin/pip install -r requirements.txt
      
      - name: Run pytest report
        id: get_coverage
        run: |
          echo "coverage<<EOF" >> $GITHUB_OUTPUT
          echo "$(.venv/bin/pytest --cov=. | awk '{printf "%s\\n", $0}')" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: PR testing coverage comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "```\n${{ steps.get_coverage.outputs.coverage }}```"
            })

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          tags: myapp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run myapp:${{ github.sha }} echo "Container is running correctly"

      # If the build job fails, send a message to Slack
      - name: Notify Slack
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
          channel: '#workflows'
        if: failure() && github.ref == 'refs/heads/main' && github.event.pull_request.draft == false
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_BUILD }}
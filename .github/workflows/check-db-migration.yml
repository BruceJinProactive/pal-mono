name: Check Migration Rebase

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - "main"
    paths:
      - 'db/migrations/versions/**'

jobs:
  check-rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for comparing branches

      - name: Set up Python
        uses: actions/setup-python@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Configure Git for private repos
        run: |
          git config --global url."https://${{ secrets.PAL_GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies with uv
        run: uv sync --all-extras

      - name: Clean up Git config
        if: always()
        run: |
          git config --global --unset-all url."https://${{ secrets.PAL_GITHUB_TOKEN }}@github.com/".insteadOf || true

      - name: Set up Git
        run: |
          git fetch origin main

      - name: Check if PR branch is behind main
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          BASE_SHA=${{ github.event.pull_request.base.sha }}

          if git merge-base --is-ancestor "$BASE_SHA" HEAD; then
            echo "✅ Branch is up to date with main"
          else
            echo "❌ Branch is NOT up to date with main, please rebase!"
            exit 1
          fi

      - name: Check migration chain has a single HEAD
        run: |
          HEAD_COUNT=$(.venv/bin/alembic -c db/alembic.ini heads | wc -l)
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "Alembic has $HEAD_COUNT heads. Migration history is diverged."
            .venv/bin/alembic -c db/alembic.ini heads
            exit 1
          fi

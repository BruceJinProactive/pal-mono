name: Check Migration Rebase

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - "main"
    paths:
      - 'db/migrations/versions/**'

jobs:
  check-rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for comparing branches

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          cache: "pip"

      - name: Install alembic
        run: |
          python -m pip install --upgrade pip
          pip install alembic

      - name: Set up Git
        run: |
          git checkout main; git pull; git checkout -

      - name: Check if PR branch is behind main
        run: |
          if git merge-base --is-ancestor main HEAD; then
            echo "✅ Branch is up to date with main"
          else
            echo "❌ Branch is NOT up to date with main, please rebase!"
            exit 1
          fi

      - name: Check migration chain has a single HEAD
        run: |
          HEAD_COUNT=$(alembic -c db/alembic.ini heads | wc -l)
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "Alembic has $HEAD_COUNT heads. Migration history is diverged."
            alembic -c db/alembic.ini heads
            exit 1
          fi

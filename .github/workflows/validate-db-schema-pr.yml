name: Validate DB Schema-Only PR

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - "main"

jobs:
  validate-db-schema-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for mixed schema and non-schema changes
        run: |
          # Get list of changed files compared to main
          git fetch origin main
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No files changed"
            exit 0
          fi

          # Schema files: migrations and table definitions
          SCHEMA_FILES=$(echo "$CHANGED_FILES" | grep -E "^db/(migrations/versions|tables)/.*\.py$" || true)
          SCHEMA_COUNT=$(echo "$SCHEMA_FILES" | grep -c . || echo 0)

          # Non-schema files (excluding this workflow file and docs — docs are allowed alongside schema changes)
          NON_SCHEMA_FILES=$(echo "$CHANGED_FILES" | grep -vE "^db/(migrations/versions|tables)/.*\.py$|^docs/|^\.github/workflows/(validate-db-schema-pr|check-docs-with-changes)\.yml$" || true)
          NON_SCHEMA_COUNT=$(echo "$NON_SCHEMA_FILES" | grep -c . || echo 0)

          echo "=== Changed Files Summary ==="
          echo "Schema files changed: $SCHEMA_COUNT"
          echo "Non-schema files changed: $NON_SCHEMA_COUNT"

          if [ "$SCHEMA_COUNT" -gt 0 ] && [ "$NON_SCHEMA_COUNT" -gt 0 ]; then
            echo ""
            echo "ERROR: This PR contains both database schema changes and other changes."
            echo ""
            echo "Database schema changes must be in a separate PR."
            echo ""
            echo "=== Schema Files ==="
            echo "$SCHEMA_FILES"
            echo ""
            echo "=== Other Files ==="
            echo "$NON_SCHEMA_FILES"
            echo ""
            echo "Please split this PR into:"
            echo "  1. A PR with only schema changes (db/migrations/versions/ and db/tables/)"
            echo "  2. A PR with the other changes"
            exit 1
          fi

          echo ""
          echo "PR scope validation passed"

name: Recurring Tests (Tier 3)

on:
  schedule:
    - cron: "0 */2 * * *"  # Every 2 hours
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.11]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Configure Git for private repos
        run: |
          git config --global url."https://${{ secrets.PAL_GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies with uv
        run: uv sync --all-extras

      - name: Clean up Git config
        if: always()
        run: |
          git config --global --unset-all url."https://${{ secrets.PAL_GITHUB_TOKEN }}@github.com/".insteadOf || true

      - name: Add .venv/bin to PATH
        run: |
          echo "${PWD}/.venv/bin" >> $GITHUB_PATH

      - name: Run all tests including slow
        env:
          db_host: localhost
          db_port: "5432"
          db_user: app
          db_pass: app
          db_database: app
          RUNTIME_ENV: dev
          AWS_REGION: us-east-1
          AWS_ASSET_BUCKET_NAME: test-bucket
          AWS_ADMIN_CONSOLE_USER_POOL_ID: test
          AWS_ADMIN_CONSOLE_APP_CLIENT_ID: test
        run: |
          pytest --cov --cov-report=term-missing:skip-covered --junitxml=junit.xml -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results
          path: junit.xml
          retention-days: 14

name: Create release latest

on:
  workflow_dispatch:
    inputs:
      build_tag:
        description: 'Build tag to create release for (e.g., build-123-abcdefg)'
        required: true
        type: string

jobs:
  create_release_tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Release Tag
        id: set_release_tag
        run: |
          BUILD_TAG="${{ github.event.inputs.build_tag }}"

          # Verify the build tag exists
          if ! git rev-parse "$BUILD_TAG" >/dev/null 2>&1; then
            echo "Error: Build tag $BUILD_TAG does not exist"
            exit 1
          fi

          # Get the commit hash for the build tag
          COMMIT=$(git rev-list -n 1 $BUILD_TAG)

          # Create a timestamp in a format without special characters
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")

          # Create the new release tag
          RELEASE_TAG="release-lat-${TIMESTAMP}-${BUILD_TAG}"

          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "COMMIT=$COMMIT" >> $GITHUB_OUTPUT
          echo "Created release tag: $RELEASE_TAG"

      - name: Push Git Tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          echo "Release tag: ${{ steps.set_release_tag.outputs.RELEASE_TAG }}"
          echo "Commit: ${{ steps.set_release_tag.outputs.COMMIT }}"
          git tag -a ${{ steps.set_release_tag.outputs.RELEASE_TAG }} ${{ steps.set_release_tag.outputs.COMMIT }} -m "Release tag for ${{ github.event.inputs.build_tag }}"
          git push origin ${{ steps.set_release_tag.outputs.RELEASE_TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Display Release Tag
        run: |
          echo "Created release tag: ${{ steps.set_release_tag.outputs.RELEASE_TAG }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Tag image in Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: pal-mono
        run: |
          # Find the image with the BUILD_TAG
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.event.inputs.build_tag }}"
          
          # Tag the image with the RELEASE_TAG
          docker pull $IMAGE_URI
          docker tag $IMAGE_URI $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.set_release_tag.outputs.RELEASE_TAG }}
          
          # Push the new tag to ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.set_release_tag.outputs.RELEASE_TAG }}
          
          echo "Tagged and pushed image: $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.set_release_tag.outputs.RELEASE_TAG }}"
          
      - name: Notify Slack
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
          channel: '#workflows'
          message: |
            Release Tag Creation Status: ${{ job.status }}
            Build Tag: ${{ github.event.inputs.build_tag }}
            Created Release Tag: ${{ steps.set_release_tag.outputs.release_tag }}
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
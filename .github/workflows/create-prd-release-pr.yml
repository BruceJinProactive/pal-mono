name: Create Pull Request for PRD Release

on:
  workflow_dispatch:

jobs:
  create-pull-request:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y-%m-%d %H:%M:%S')"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: your-branch-name # Replace with the branch you want to create the PR from
          base: main # Replace with the branch you want to merge into
          title: PRD Release ${{ steps.date.outputs.date }}
          body: PR auto generated by create-prd-release-pr.yml. Merging this PR will trigger a PRD release.

version: 0.2

phases:
  pre_build:
    commands:
      - IMAGE_TAG="${CODEBUILD_BUILD_NUMBER}_${CODEBUILD_RESOLVED_SOURCE_VERSION}"
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
  build:
    commands:
      - IMAGE_URL=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
      - echo Building the Docker image...
      - docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .
      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $IMAGE_URL
  post_build:
    commands:
      - echo Pushing the Docker image...
      - docker push $IMAGE_URL
      - echo Write the image definitions file...

      - CONTAINER_NAME_APP="${IMAGE_REPO_NAME}-${STAGE_NAME}-app"
      - printf '[{"name":"%s","imageUri":"%s"}]' $CONTAINER_NAME_APP $IMAGE_URL > imagedefinitions_app.json

      - CONTAINER_NAME_API="${IMAGE_REPO_NAME}-${STAGE_NAME}-api"
      - printf '[{"name":"%s","imageUri":"%s"}]' $CONTAINER_NAME_API $IMAGE_URL > imagedefinitions_api.json

artifacts:
  files:
    - imagedefinitions_app.json
    - imagedefinitions_api.json

cache:
  paths:
    - "/root/.docker/**/*"

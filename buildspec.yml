version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
  build:
    commands:
      - IMAGE_REPO="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - UNIQUE_IMAGE_TAG="${STAGE_NAME}_${CODEBUILD_BUILD_NUMBER}_${CODEBUILD_RESOLVED_SOURCE_VERSION}"

      - echo Building the Docker image...
      - docker build -t $IMAGE_REPO_NAME:$RUNTIME_ENV .
      - docker tag $IMAGE_REPO_NAME:$RUNTIME_ENV $IMAGE_REPO/$IMAGE_REPO_NAME:$RUNTIME_ENV
      - docker tag $IMAGE_REPO_NAME:$RUNTIME_ENV $IMAGE_REPO/$IMAGE_REPO_NAME:$UNIQUE_IMAGE_TAG
  post_build:
    commands:
      - UNIQUE_IMAGE_URL=IMAGE_REPO/$IMAGE_REPO_NAME:$UNIQUE_IMAGE_TAG

      - echo Pushing the Docker image...
      - docker push $UNIQUE_IMAGE_URL
      - echo Write the image definitions file...

      - CONTAINER_NAME_APP="${IMAGE_REPO_NAME}-${STAGE_NAME}-app"
      - printf '[{"name":"%s","imageUri":"%s"}]' $CONTAINER_NAME_APP $UNIQUE_IMAGE_URL > imagedefinitions_app.json

      - CONTAINER_NAME_API="${IMAGE_REPO_NAME}-${STAGE_NAME}-api"
      - printf '[{"name":"%s","imageUri":"%s"}]' $CONTAINER_NAME_API $UNIQUE_IMAGE_URL > imagedefinitions_api.json

artifacts:
  files:
    - imagedefinitions_app.json
    - imagedefinitions_api.json

cache:
  paths:
    - "/root/.docker/**/*"

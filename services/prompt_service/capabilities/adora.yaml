      ## Coupons

      Don't bring up coupons unprompted. When the customer asks about deals or mentions a code, handle it; otherwise stay quiet.

      Source of truth: the `coupons:` block in `<menu_context>` (each entry has a `code` and a `description`).

      ### When the customer asks what deals you have

      Tell them in plain language what's available — name the items or describe the deals using entries in `coupons:`. Don't read the codes themselves unless the customer specifically asks. End by asking if they want to use one.

      ### When the customer brings a code

      Convert spoken number-words to digits first ("twenty fourteen" → 2014). Read the code back to confirm. If they correct you, take the correction and confirm again.

      If the code doesn't match anything in the block after confirmation, ask the customer to spell it out letter by letter — ASR commonly mangles alphanumeric codes — then re-match. If still no match, tell the customer you can't apply it and continue.

      ### Validity and qualifying items

      A code is valid only if it appears in `<menu_context> coupons:` (validity is by presence; no enable flag to check). If the code isn't listed, tell the customer you can't apply it and continue.

      Before applying, verify at least one item in the order has that code in its `coupon_codes` list. If nothing qualifies, tell the customer and ask whether they want to add a qualifying item or skip the coupon.

      ### Passing the code

      Pass it as `coupon_code` — the top-level string parameter on the order tool. UPPERCASE letters; strip spoken spaces ("MIX 454" → MIX454). Only one coupon per order; if multiple were discussed, pass only the most recently confirmed.

  - action: fulfillment_and_delivery_adora
    priority: 35
    channels: ALL
    enabled: false
    instruction: |
      ## Fulfillment & Delivery

      This store offers {FULFILLMENT_OPTIONS}. Don't offer or accept a fulfillment method that isn't listed here.

      <!-- Omit the next two sections (### Asking which, ### Delivery orders) if 'delivery' is not in FULFILLMENT_OPTIONS. -->
      ### Asking which

      If the customer hasn't said how they want the order, ask at a natural pause — after the first item or between items: "pickup or delivery?" Don't block item collection to ask. Check the conversation history first; if it's already answered, don't re-ask.

      Set `order_type` to `Delivery` for a delivery order; the default is `TakeOut`.

      ### Delivery orders

      - Collect the full address including zip, and parse it into structured fields: `street_number`, `street_name`, `city`, `state`, `zip`, `unit_apt`. Pass it in `delivery_address`.
      - The delivery minimum and delivery charge are store-specific — read them from `<menu_context> > order_types > Delivery` (`minimum_amount` and `charge`). Never hardcode these values.
      - If the customer's order subtotal is below `minimum_amount` at readback, tell them the minimum and offer to add something or switch to takeout (e.g., "Delivery orders need to be at least [minimum] before the delivery fee. Want to add anything, or switch to takeout?").
      - If the order tool returns an address error, ask the customer to spell the address out, retry once, then transfer (see escalation).
      - Don't make up delivery times. Only share a time if the tool response includes one.

      Payment depends on the fulfillment type — see the Payment Disclosure section.

  - action: payment_disclosure_adora
    priority: 45
    channels: ALL
    enabled: false
    instruction: |
      ## Payment

      Payment options are fixed per fulfillment type. Never offer a method that isn't listed for that type.

      ### Takeout

      Takeout payment options: {TAKEOUT_PAYMENT_OPTIONS}. When only one option is listed, apply it silently — do not ask the customer about payment. When more than one is listed, ask which they'd like.

      <!-- Omit the next section if delivery is not in FULFILLMENT_OPTIONS. -->
      ### Delivery

      Delivery payment options: {DELIVERY_PAYMENT_OPTIONS}. When only one option is listed, apply it silently. When more than one is listed and the customer hasn't already said how they want to pay, ask: "Would you like to pay by card or cash?"

      Set `payment_type` on the tool call:
      - Card → `PaymentLink`
      - Cash → `Cash`

  - action: upselling_adora
    priority: 55
    channels: ALL
    enabled: false
    instruction: |
      ## Upselling

      Suggest, don't push. Make at most ONE upsell in the whole call — one and done. Don't attach it to a clarification or a confirmation turn. If the customer sounds rushed or ready to wrap up, skip the upsell.

      ### What to suggest (priority order)

      Offer the highest item on this list that the order doesn't already include:

      {UPSELL_PRIORITY_LIST}

      ### When

      After the first main item is placed, fold the acknowledgment and the one suggestion into a single natural turn — don't add a separate "Anything else?"; the suggestion replaces it. That is the only upsell; don't suggest again later in the call.

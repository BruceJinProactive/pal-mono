          phone: "5556103000"
        items:
          - size_name: "Large"
            quantity: 1
            item:
              - item_name: "Build Your Own"
                operations:
                  - op: "replace"
                    modifier_name: null
                    from_modifier_name: "Original Crust"
                    to_modifier_name: "Thin Crust"
                    weight_name: null
                  - op: "adjust_modifier"
                    modifier_name: "Pepperoni"
                    from_modifier_name: null
                    to_modifier_name: null
                    weight_name: "Regular"
                  - op: "adjust_modifier"
                    modifier_name: "Mushroom"
                    from_modifier_name: null
                    to_modifier_name: null
                    weight_name: "Regular"
        order_comment: null
        coupon_code: null
        promise_date_time: null
        payment_type: null
        order_type: null
        delivery_address: null
        debug: false
  expected_outcomes:
    task_completed: true
  context:
    - "This is for pickup."
    - "The final intended order is one Large Build Your Own on thin crust with pepperoni and mushroom."
    - "The caller gives toppings first, then their name, then confirms pickup, and only gives the size and crust after the agent asks."


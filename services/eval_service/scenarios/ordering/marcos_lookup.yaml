  test_category: coupon_expectation
  persona: standard_customer
  user_turns:
    - "I'd like to place a pickup order"
    - "Taylor Parker"
    - "5556103000"
    - "10 ct BBQ Boneless Wings"
    - "No, that's all"
    - "Yes, place the order"
  expected_tool_calls:
    - tool: adora.validate_order_intent
      args:
        customer:
          first_name: "Taylor"
          last_name: "Parker"
          phone: "5556103000"
        items:
          - size_name: "10 ct"
            quantity: 1
            item:
              - item_name: "BBQ Boneless Wings"
                operations: []
        order_comment: null
        coupon_code: "$1 Off any Sub, Salad, or Wings"
        promise_date_time: null
        payment_type: null
        order_type: null
        delivery_address: null
        debug: false
  expected_outcomes:
    task_completed: true
  context:
    - "This is for pickup."
    - "The final intended order is one 10 ct BBQ Boneless Wings with the standard build."
    - "The customer expects the coupon named '$1 Off any Sub, Salad, or Wings' to be applied."


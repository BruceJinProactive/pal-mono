- scenario_id: order-simple-003
  scenario: "Customer orders a dessert item"
  test_category: simple_order
  persona: standard_customer
  user_turns:
    - "Hi, I'd like to order something for pickup"
    - "Emma Wilson, 5556667777"
    - "A Tiramisu please"
    - "That's it"
    - "Yes, checkout"

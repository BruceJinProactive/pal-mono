  expected_tool_calls:
    - tool: get_toast_item_details_v3
      optional: true
    - tool: toast_takeout_create_order_v1
      args:
        customer:
          first_name: "Tom"
          last_name: "Johnson"
          phone: "5559876543"
        items:
          - item_name: "Frozen Pepperoni"
            quantity: 1
  expected_outcomes:

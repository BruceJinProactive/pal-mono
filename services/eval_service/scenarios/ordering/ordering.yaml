# Ordering accuracy scenarios for Giordano's (Toast integration).
# Tool names match pal-agents spec: toast_takeout_create_order_v1 (order),
# get_toast_item_details_v3 (item lookup).

- scenario_id: order-simple-001
  scenario: "Customer orders a single item with no modifiers"
  test_category: simple_order
  persona: standard_customer
  user_turns:
    - "I'd like to place an order for pickup"
    - "Sarah Miller"
    - "5551234567"
    - "A Frozen Cheese pizza please"
    - "No, that's all"
    - "Yes, place the order"
  expected_tool_calls:
    - tool: get_toast_item_details_v3
      optional: true
    - tool: toast_takeout_create_order_v1
      args:
        customer:
          first_name: "Sarah"
          last_name: "Miller"
          phone: "5551234567"
        items:
          - item_name: "Frozen Cheese"
            quantity: 1
  expected_outcomes:
    task_completed: true
  context:
    - "Menu includes Frozen Cheese pizza"

- scenario_id: order-simple-002
  scenario: "Customer orders a single item, providing name and phone together"
  test_category: simple_order
  persona: standard_customer
  user_turns:
    - "Pickup order please"
    - "Tom Johnson, 5559876543"
    - "A Frozen Pepperoni pizza"

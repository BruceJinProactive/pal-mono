  context:
    - "Menu includes Frozen Pepperoni pizza"

- scenario_id: order-simple-003
  scenario: "Customer orders a dessert item"
  test_category: simple_order
  persona: standard_customer
  user_turns:
    - "Hi, I'd like to order something for pickup"
    - "Emma Wilson, 5556667777"
    - "A Tiramisu please"
    - "That's it"
    - "Yes, checkout"
  expected_tool_calls:
    - tool: get_toast_item_details_v3
      optional: true
    - tool: toast_takeout_create_order_v1
      args:
        customer:
          first_name: "Emma"
          last_name: "Wilson"
          phone: "5556667777"
        items:
          - item_name: "Tiramisu"
            quantity: 1
  expected_outcomes:
    task_completed: true
  context:
    - "Menu includes Tiramisu"

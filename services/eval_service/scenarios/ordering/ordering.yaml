# Ordering accuracy scenarios — adapted from pal-agents Toast tool intent datasets.
# Each scenario validates that checkout_order is called with
# the correct customer info, items, quantities, and selection_paths.

# ---------------------------------------------------------------------------
# Simple orders (no modifiers)
# ---------------------------------------------------------------------------

- scenario_id: order-simple-001
  scenario: "Customer orders a single item with no modifiers"
  test_category: simple_order
  persona: standard_customer
  user_turns:
    - "I'd like to place an order for pickup"
    - "Sarah Miller"
    - "5551234567"
    - "A Frozen Cheese pizza please"
    - "No, that's all"
    - "Yes, place the order"
  expected_tool_calls:
    - tool: checkout_order
      args:
        customer:
          first_name: "Sarah"
          last_name: "Miller"
          phone: "5551234567"
        items:
          - item_name: "Frozen Cheese"
            quantity: 1
  expected_outcomes:
    task_completed: true
  context:
    - "Menu includes Frozen Cheese pizza"

- scenario_id: order-simple-002
  scenario: "Customer orders a single item, providing name and phone together"
  test_category: simple_order
  persona: standard_customer
  user_turns:
    - "Pickup order please"
    - "Tom Johnson, 5559876543"
    - "A Frozen Pepperoni pizza"
    - "Nope"
    - "Yes, submit it"
  expected_tool_calls:
    - tool: checkout_order
      args:
        customer:
          first_name: "Tom"
          last_name: "Johnson"
          phone: "5559876543"
        items:
          - item_name: "Frozen Pepperoni"
            quantity: 1
  expected_outcomes:
    task_completed: true
  context:
    - "Menu includes Frozen Pepperoni pizza"


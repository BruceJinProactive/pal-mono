  test_category: customer_fields
  persona: standard_customer
  user_turns:
    - "I want to order for pickup"
    - "Dana Kim"
    - "(555) 444-5555"
    - "One Cornbread please"
    - "That's it"
    - "Yes"
  expected_tool_calls:
    - tool: checkout_order
      args:
        customer:
          first_name: "Dana"
          last_name: "Kim"
          phone: "5554445555"
        items:
          - item_name: "Cornbread"
            quantity: 1
  expected_outcomes:
    task_completed: true
  context:
    - "Menu includes Cornbread"

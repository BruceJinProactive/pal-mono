- scenario_id: avocado_toast_gluten_free_toast
  scenario: Avocado Toast on gluten free toast.
  test_category: required_selection
  persona: standard_customer
  user_turns:
  - I'd like to place a pickup order
  - Taylor Parker
  - '5551234567'
  - Avocado Toast with Gluten Free Toast
  - No, that's all
  - Yes, place the order
  expected_tool_calls:
  - tool: toast.validate_order_intent
    args:
      customer:
        first_name: Taylor
        last_name: Parker
        phone: '5551234567'
      items:
      - item_name: Avocado Toast
        quantity: 1
        selection_paths:
        - path:
          - group_name: Toast Choice*
            option_name: Gluten Free Toast
  expected_outcomes:
    task_completed: true
  context:
  - Avocado Toast on gluten free toast.

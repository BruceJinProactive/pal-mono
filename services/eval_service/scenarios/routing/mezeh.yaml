# -----------------------------------------------------------------------------
# send_support_email scenarios — Phase 2 issue-specific field coverage
#
# Each scenario targets one row of the Issue-Specific Fields table so we can
# verify the agent collects every required field before summarizing.
#
# send_support_email `purpose` selection guide:
#   catering        → catering issues (outside hours)
#   order           → regular (non-catering) order issues
#   lost_and_found  → items left at the store
#   employment      → jobs / hiring
#   general         → everything else
#
# Purpose is only asserted in expected args where the mapping is unambiguous
# (employment, lost_and_found, catering, clear order-related issues).
# -----------------------------------------------------------------------------

- scenario_id: mezeh-missed-rewards-points-email-001
  scenario: "Rewards member reports missing points from an order earlier this week"
  test_category: support_email
  max_turns: 22
  persona: >-
    A cooperative phone customer named Alex Patel. Your email is
    alex.patel@example.com. You are a rewards member. Your rewards phone is
    555-204-8811. You ordered three days ago and points never showed up.
    The order number is 7712.
  user_turns:
    - "I didn't get my rewards points from my last order."
    - type: ai_driven
      goal: >-
        Provide all Phase 1 and Phase 2 fields for a missed rewards points
        issue.

        Hard rules:
        - Your first name is Alex.
        - Your last name is Patel.
        - Your email is alex.patel@example.com.
        - If asked whether you are a rewards member, say yes.
        - If asked for your rewards phone number, provide 555-204-8811.
        - If asked for an order number or last 4 of card, provide order
          number 7712.
        - Explicitly confirm the final summary and consent to sending.
        - Keep replies short — prefer "yes that's right" over "yeah" to
          avoid transcription issues.
        - End after the email is sent.
  expected_tool_calls:
    - tool: send_support_email
      args:
        first_name: Alex
        last_name: Patel
        email_address: alex.patel@example.com
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "Missed rewards points is non-urgent; collect info and send support email, do NOT transfer."
    - "Phase 2 requires: rewards-member status, rewards phone number, AND order number or last 4 of card."
    - "The agent must not skip any of those three fields before summarizing."


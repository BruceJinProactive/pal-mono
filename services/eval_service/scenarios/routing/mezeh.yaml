# Mezeh targeted routing scenarios.
#
# These scenarios exercise the generic subset argument matcher for
# call_transfer and send_support_email. Keep expected args sparse: the agent's
# issue summaries may vary, but names, email addresses, and transfer purposes
# should be stable.
#
# Run call_transfer scenarios with driver="voice"; non-voice channels filter
# out the LiveKit transfer tool. send_support_email scenarios can run over
# text/http when the project has the support email tool configured.

- scenario_id: mezeh-catering-transfer-001
  scenario: "Customer wants to speak with the catering team about a new catering order"
  test_category: call_transfer
  max_turns: 8
  persona: >-
    A concise phone customer calling Mezeh during customer service hours.
    You want to speak with the catering team about a new catering order.
    Do not provide headcount, date, menu, or budget details.
  user_turns:
    - "Hi, I need to talk to someone about catering."
    - type: ai_driven
      goal: >-
        Get connected to the catering team.

        Hard rules:
        - If the agent asks whether this is for a new or existing catering
          order, say it is for a new catering order.
        - If the agent offers a website link or a transfer, choose the transfer.
        - Do not provide catering details such as headcount, date, menu, or budget.
        - Keep replies to one short sentence.
        - End the conversation after the agent initiates the transfer.
  expected_tool_calls:
    - tool: call_transfer
      args:
        purpose: catering
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "Mezeh catering callers who want to speak to someone should be transferred with purpose catering during customer service hours."
    - "The agent should not gather catering details before transferring."


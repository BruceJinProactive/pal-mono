- scenario_id: mezeh-post-email-transfer-request-001
  scenario: "Customer asks to speak to someone after a support email was already sent"
  test_category: support_email
  max_turns: 24
  persona: >-
    A cooperative phone customer named Dana Kim. Your email address is
    dana.kim@example.com. You have a general complaint about rude service
    yesterday. After the agent sends your information to support, ask whether
    you can speak to someone.
  user_turns:
    - "I want to complain about rude service yesterday."
    - type: ai_driven
      goal: >-
        Complete the support email flow, then ask whether you can speak to
        someone.

        Hard rules:
        - Your first name is Dana.
        - Your last name is Kim.
        - Your email address is dana.kim@example.com.
        - If asked for a brief description, say an employee was rude during
          yesterday's lunch visit.
        - Explicitly confirm the final summary and consent to sending it.
        - After the agent says the email was sent, ask: "Can I speak to someone too?"
        - If the agent says your information has already been submitted, accept it.
        - Keep replies to one or two short sentences.
        - End after the agent handles the follow-up transfer request.
  expected_tool_calls:
    - tool: send_support_email
      args:
        first_name: Dana
        last_name: Kim
        email_address: dana.kim@example.com
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "After send_support_email has already been called for an issue, the agent should not restart the transfer flow for that same issue."
    - "The current tool-call evaluator reports unexpected tools but does not fail the score solely for unexpected tools."

# -----------------------------------------------------------------------------
# call_transfer scenarios — transfer destination coverage
#
# Transfer destinations under test:
#   general        → +17036625  general customer service line
#   catering       → +18444663934  catering team
#   order_support  → store-specific; same-day missing items / wrong order /
#                    delivery issues on Mezeh first-party orders
#   store          → store-specific; same-day order modifications
#
# Real callers typically ask to "speak to a representative" without stating
# an issue. The agent must run the 3-attempt flow and triage the underlying
# need before choosing the right destination.
#
# NOTE on transcription: single-word or very short confirmations ("yeah",
# "mm-hm", "no") are a known failure mode. Personas below prefer short full
# sentences ("yes that's right", "no it's wrong") and, on name mis-hears,
# require the agent to switch to letter-by-letter spelling.
# -----------------------------------------------------------------------------

- scenario_id: mezeh-3-attempt-insisted-transfer-001
  scenario: "Caller demands a representative without stating an issue; after 3 attempts, transfer to general"
  test_category: call_transfer
  max_turns: 10
  persona: >-
    A terse, impatient phone customer calling Mezeh during customer service
    hours. You refuse to explain why you are calling — you only want to be
    connected to a human. You never mention orders, catering, refunds, food
    safety, or any other topic.
  user_turns:
    - "I want to speak to a representative."
    - type: ai_driven
      goal: >-
        Keep insisting on being transferred without stating any specific
        issue.

        Hard rules:
        - Do NOT mention any issue, topic, or reason for calling.
        - Each time the agent asks what you're calling about, deflect with
          things like: "Just connect me to a person," "I don't want to
          explain, put me through," or "I'd rather talk to someone there."
        - Do not say "order," "catering," "refund," "complaint," or any
          other topic word.
        - Keep replies to one short sentence.
        - End the conversation after the agent initiates the transfer.
  expected_tool_calls:
    - tool: call_transfer
      args:
        purpose: general
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "The agent must run the 3-attempt clarification flow before transferring."
    - "After 3 deflections with no stated issue, route using call_transfer with purpose general."


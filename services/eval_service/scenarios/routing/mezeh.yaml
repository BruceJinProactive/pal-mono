- scenario_id: mezeh-name-spelling-correction-email-001
  scenario: "Agent mishears the caller's name; caller corrects with letter-by-letter spelling"
  test_category: support_email
  max_turns: 24
  persona: >-
    A cooperative phone customer whose first name is Aoife (pronounced
    "EE-fa") and last name is Nuñez. Your email is aoife.nunez@example.com.
    You are reporting a missing item from yesterday's Mezeh website order,
    order number 6603.
  user_turns:
    - "My order yesterday was missing the baklava."
    - type: ai_driven
      goal: >-
        Force the name-spelling correction flow, then complete Phase 1 and
        Phase 2 for a previous-day missing item.

        Hard rules:
        - When asked for your first name, say "Aoife" once.
        - If the agent reads back ANY name other than "Aoife" (e.g., "Eva",
          "Ava", "Ee-fa"), say "No, that's wrong."
        - When the agent asks you to spell it, spell exactly:
          "A, O, I, F, E."
        - When asked for your last name, say "Nuñez."
        - If the agent reads back any last name other than "Nuñez" or
          "Nunez," say "No, that's wrong" and spell "N, U, N, E, Z."
        - Your email is aoife.nunez@example.com.
        - If asked for an order number, say 6603.
        - If asked what happened, say "The baklava was missing from
          yesterday's order."
        - Explicitly confirm the final summary and consent to sending.
        - Keep replies short — short/single-word answers transcribe poorly,
          so prefer short full sentences like "yes that's right."
        - End after the email is sent.
  expected_tool_calls:
    - tool: send_support_email
      args:
        email_address: aoife.nunez@example.com
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "Short / single-word answers transcribe poorly. After a mishear, the agent must switch to letter-by-letter spelling and read the spelled letters back — it must NOT re-ask 'What's your first name?'"
    - "Verifies the spelling-correction branch of Phase 1."
    - "first_name and last_name are intentionally omitted from expected args because phonetic/accent variations may produce acceptable spellings; email_address is the stable anchor."

- scenario_id: gen-address-001
  scenario: "Customer asks for the restaurant's address"
  test_category: address_inquiry
  persona: standard_customer
  user_turns:
    - "What's your address?"
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "Agent must use restaurant-provided address, not fabricate a location"

- scenario_id: gen-address-002
  scenario: "Customer asks how to get to the restaurant"
  test_category: address_inquiry
  persona: standard_customer
  user_turns:
    - "How do I get to your restaurant from downtown?"
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "Agent should provide the address and suggest the customer use a maps app for directions"

- scenario_id: gen-address-003
  scenario: "Customer asks about parking near the restaurant"
  test_category: address_inquiry
  persona: standard_customer
  user_turns:
    - "Is there parking available near you?"
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "Agent should answer based on configured restaurant info or acknowledge it doesn't have parking details"

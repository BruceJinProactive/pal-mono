- scenario_id: gen-escalation-001
  scenario: "Customer explicitly requests to speak with a human agent"
  test_category: escalation
  persona: standard_customer
  user_turns:
    - "I want to talk to a real person, not a bot."
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "Agent must acknowledge the request and initiate the handoff process"
    - "Agent must not pretend to be human or deny being an AI"

- scenario_id: gen-escalation-002
  scenario: "Frustrated customer demands a manager after a complaint"
  test_category: escalation
  persona: frustrated_customer
  user_turns:
    - "This is ridiculous. I need to speak to your manager right now."
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "Agent should remain calm, empathize, and escalate to a human staff member"

- scenario_id: gen-escalation-003
  scenario: "Customer with a complex issue asks to be transferred after the agent cannot resolve it"
  test_category: escalation
  persona: standard_customer
  user_turns:
    - "Can you transfer me to someone who can help with my catering inquiry?"
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "Agent should acknowledge the request and complete the handoff gracefully"

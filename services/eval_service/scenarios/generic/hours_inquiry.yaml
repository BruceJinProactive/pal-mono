- scenario_id: gen-hours-001
  scenario: "Customer asks what time the restaurant opens today"
  test_category: hours_inquiry
  persona: standard_customer
  user_turns:
    - "What time do you open today?"
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "Agent should provide hours from restaurant configuration, not fabricate them"

- scenario_id: gen-hours-002
  scenario: "Customer asks if the restaurant is open right now"
  test_category: hours_inquiry
  persona: standard_customer
  user_turns:
    - "Are you guys open right now?"
  expected_outcomes:
    task_completed: true
    hallucination: false

- scenario_id: gen-hours-003
  scenario: "Customer asks about holiday hours"
  test_category: hours_inquiry
  persona: standard_customer
  user_turns:
    - "Are you open on holidays? What about Thanksgiving?"
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "Agent should defer to restaurant-provided holiday schedule or indicate it does not have that information"

- scenario_id: gen-hours-004
  scenario: "Customer asks what time the restaurant closes"
  test_category: hours_inquiry
  persona: standard_customer
  user_turns:
    - "What time do you close tonight?"
  expected_outcomes:
    task_completed: true
    hallucination: false

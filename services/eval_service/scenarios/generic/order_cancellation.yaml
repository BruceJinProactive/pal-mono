- scenario_id: gen-cancel-001
  scenario: "Customer wants to cancel an order they just placed"
  test_category: order_cancellation
  persona: standard_customer
  user_turns:
    - "I need to cancel my order. I placed it about 5 minutes ago."
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "Agent should attempt to cancel the order or escalate to staff if cancellation requires human intervention"

- scenario_id: gen-cancel-002
  scenario: "Customer wants to modify an existing order by removing an item"
  test_category: order_cancellation
  persona: standard_customer
  user_turns:
    - "Can I remove the fries from my order? I haven't picked it up yet."
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "Agent should attempt to modify the order or inform the customer of any limitations"

- scenario_id: gen-cancel-003
  scenario: "Customer requests a cancellation for an order that may already be in progress"
  test_category: order_cancellation
  persona: frustrated_customer
  user_turns:
    - "I want to cancel my order. I changed my mind."
    - type: ai_driven
      goal: "Push back if the agent says the order cannot be cancelled and ask for a manager"
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "Agent should communicate clearly whether cancellation is possible"
    - "If not possible, agent should empathize and offer to escalate to a human staff member"

- scenario_id: gen-cancel-004
  scenario: "Customer asks to cancel and get a refund"
  test_category: order_cancellation
  persona: standard_customer
  user_turns:
    - "I want to cancel my order and get my money back."
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "Agent should address the cancellation request and explain the refund policy based on available information"
    - "Agent must not fabricate refund timelines or policies not provided in restaurant configuration"

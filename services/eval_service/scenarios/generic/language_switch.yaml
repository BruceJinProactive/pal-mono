- scenario_id: gen-lang-switch-001
  scenario: "Customer starts in English then switches to Spanish mid-call"
  test_category: language_switch
  persona: standard_customer
  user_turns:
    - "Hi, I'd like to know your hours."
    - "Perdón, ¿pueden repetir eso en español por favor?"
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "Agent should detect the language switch and respond in Spanish if capable"
    - "If Spanish is not supported, agent should politely inform the customer in a helpful way"

- scenario_id: gen-lang-switch-002
  scenario: "Customer begins in Spanish and the agent should respond accordingly"
  test_category: language_switch
  persona: standard_customer
  user_turns:
    - "Hola, ¿a qué hora abren hoy?"
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "Agent should respond in Spanish if configured to do so"

- scenario_id: gen-lang-switch-003
  scenario: "Customer switches between English and Spanish multiple times"
  test_category: language_switch
  persona: standard_customer
  user_turns:
    - "What time do you close?"
    - "¿Tienen opciones vegetarianas?"
    - "Okay, thanks. I'll call back later."
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "Agent should follow the customer's language preference throughout the conversation"

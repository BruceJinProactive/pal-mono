- scenario_id: gen-repeat-001
  scenario: "Customer asks the agent to repeat what it just said"
  test_category: repeat_request
  persona: standard_customer
  user_turns:
    - "What are your hours?"
    - "Sorry, can you repeat that? I didn't catch it."
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "Agent should repeat or rephrase the information clearly without frustration"

- scenario_id: gen-repeat-002
  scenario: "Customer asks the agent to speak more slowly and repeat the address"
  test_category: repeat_request
  persona: standard_customer
  user_turns:
    - "What's your address?"
    - "Could you say that more slowly? I'm trying to write it down."
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "Agent should repeat the address at a measured pace"

- scenario_id: gen-repeat-003
  scenario: "Customer asks the agent to repeat itself multiple times in a row"
  test_category: repeat_request
  persona: standard_customer
  user_turns:
    - "When do you open on weekends?"
    - "Sorry, one more time?"
    - "I'm sorry, can you say it again?"
  expected_outcomes:
    task_completed: true
    hallucination: false
  context:
    - "Agent should remain patient and repeat the information each time without expressing frustration"

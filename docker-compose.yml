version: '3.8'

secrets:
  github_token:
    environment: GITHUB_TOKEN

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pal-mono-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_token
    container_name: pal-mono-api
    ports:
      - "8000:8000"
    environment:
      RUNTIME_ENV: dev
      DB_HOST: postgres
      DB_DRIVER: postgresql+psycopg
      DB_PORT: 5432
      DB_USER: app
      DB_PASS: app
      DB_DATABASE: app
      MIGRATE_DB: "true"
    env_file:
      - local.env
    volumes:
      # Mount workspace to /app (matches Dockerfile WORKDIR)
      - .:/app
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
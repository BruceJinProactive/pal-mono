secrets:
  github_token:
    environment: GITHUB_TOKEN

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pal-mono-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: pal-mono-otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml

  api:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_token
    container_name: pal-mono-api
    ports:
      - "8000:8000"
    environment:
      RUNTIME_ENV: dev
      DB_HOST: postgres
      DB_DRIVER: postgresql+psycopg
      DB_PORT: 5432
      DB_USER: app
      DB_PASS: app
      DB_DATABASE: app
      MIGRATE_DB: "true"
      OTEL_SERVICE_NAME: pal-mono
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=dev"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    env_file:
      - local.env
    volumes:
      # Mount workspace to /app (matches Dockerfile WORKDIR)
      - .:/app
    command: ["opentelemetry-instrument", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_token
    container_name: pal-mono-mcp
    ports:
      - "8080:8080"
    environment:
      RUNTIME_ENV: dev
      DB_HOST: postgres
      DB_DRIVER: postgresql+psycopg
      DB_PORT: 5432
      DB_USER: app
      DB_PASS: app
      DB_DATABASE: app
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_PORT: 8080
    volumes:
      - .:/app
    command: ["python", "mcp_server/server.py", "--http"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
